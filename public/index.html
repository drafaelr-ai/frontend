<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0061FC" />

    <!-- Ícones / PWA -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=5" />

    <!-- iOS: instalado na tela de início abre como app (sem barra do Safari).
         black-translucent exige o tratamento de safe area do mobile.css —
         sem ele o conteúdo fica por baixo do relógio/notch. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Obraly" />

    <!-- Design system -->
    <meta name="color-scheme" content="light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <!-- SEO -->
    <title>Obraly — Gestão de Obras e Patrimônio</title>
    <meta name="title" content="Obraly — Gestão de Obras e Patrimônio" />
    <meta name="description" content="Controle completo de obras, orçamentos, cronogramas, diário de obra, patrimônio e relatórios financeiros. A plataforma que organiza sua construtora." />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://obraly.uk/" />
    <meta property="og:title" content="Obraly — Gestão de Obras e Patrimônio" />
    <meta property="og:description" content="Controle completo de obras, orçamentos, cronogramas, diário de obra, patrimônio e relatórios financeiros." />
    <meta property="og:image" content="https://obraly.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Obraly — Plataforma de gestão de obras" />
    <meta property="og:site_name" content="Obraly" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://obraly.uk/" />
    <meta name="twitter:title" content="Obraly — Gestão de Obras e Patrimônio" />
    <meta name="twitter:description" content="Controle completo de obras, orçamentos, cronogramas, diário de obra, patrimônio e relatórios financeiros." />
    <meta name="twitter:image" content="https://obraly.uk/og-image.png" />
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este app.</noscript>
    <div id="root"></div>
  </body>
</html>
