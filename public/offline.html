<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0061FC" />
    <title>Obraly indisponível</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9fc; color: #14213d; font: 16px Inter, system-ui, sans-serif; }
      main { max-width: 360px; padding: 32px; text-align: center; }
      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0; color: #53627a; line-height: 1.5; }
      button { margin-top: 24px; padding: 10px 16px; border: 0; border-radius: 8px; background: #0061fc; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo192.png" alt="Obraly" />
      <h1>Sem conexão</h1>
      <p>Verifique a internet e tente abrir o Obraly novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
